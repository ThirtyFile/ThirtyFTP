# The pull-request gate: formatting, clippy with warnings as errors, the documentation, and the tests on Linux and Windows; real FTP clients against the
# example server on Linux; and the dependencies (cargo deny).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # Called by release.yml
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked
      # The fuzz targets are not built by the tests: an API change must not break them unseen (the fuzzing itself is in fuzz.yml)
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTFLAGS: --cfg fuzzing
      # What `cargo publish` would send must build by itself. In a folder of its own: the build cache is saved from `target`, and the unpacked
      # crate in it makes the cache step fail to read the folder
      - run: cargo package --locked
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/package

  # curl, Python's ftplib and lftp, plain and over TLS, against the in-memory example server
  clients:
    name: Real clients
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - run: bash scripts/interop.sh
        env:
          INTEROP_REQUIRE_LFTP: "1"

  # Known security problems in the dependencies, their licences and where they come from (deny.toml)
  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cargo deny check

  passed:
    name: Checks passed
    if: always()
    needs: [check, clients, deny]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success && test "${{ needs.clients.result }}" = success && test "${{ needs.deny.result }}" = success
